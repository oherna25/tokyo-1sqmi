<script type="module">
import * as THREE from 'three';
const D=JSON.parse(document.getElementById('citydata').textContent);
const [LAT0,LON0,LAT1,LON1]=D.bb, LATC=(LAT0+LAT1)/2, LONC=(LON0+LON1)/2;
const M_LAT=111320, M_LON=111320*Math.cos(LATC*Math.PI/180), Q=1e-6;
const W=(LON1-LON0)*M_LON, H=(LAT1-LAT0)*M_LAT;      // metres ≈ 1609 x 1609
const xOf=q=>q*Q*M_LON-W/2, zOf=q=>q*Q*M_LAT-H/2;        // quantised deg -> metres
const NAMES=D.N;
const nmOf=b=>b.name>=0?NAMES[b.name]:null;

// ---------- polygon triangulation (ear clipping, small rings) ----------
function ringArea(P,n){let a=0;for(let i=0,j=n-1;i<n;j=i++)a+=P[i*2]*P[j*2+1]-P[j*2]*P[i*2+1];return a/2;}
function tri(P,n){                                   // -> triangle index list (local)
  if(n<3)return[];
  let idx=[...Array(n).keys()];
  const cw=ringArea(P,n)<0;
  const X=i=>P[i*2], Y=i=>P[i*2+1];
  const side=(a,b,c)=>(X(b)-X(a))*(Y(c)-Y(a))-(Y(b)-Y(a))*(X(c)-X(a));
  const out=[];
  let guard=n*n*4;
  while(idx.length>3&&guard-->0){
    let cut=false;
    for(let k=0;k<idx.length;k++){
      const a=idx[(k+idx.length-1)%idx.length],b=idx[k],c=idx[(k+1)%idx.length];
      const s=side(a,b,c);
      if(cw?s<=0:s>=0)continue;                       // reflex
      let ok=true;
      for(const p of idx){
        if(p===a||p===b||p===c)continue;
        if(side(a,b,p)*(cw?-1:1)>=0&&side(b,c,p)*(cw?-1:1)>=0&&side(c,a,p)*(cw?-1:1)>=0){ok=false;break;}
      }
      if(!ok)continue;
      out.push(a,b,c); idx.splice(k,1); cut=true; break;
    }
    if(!cut)break;
  }
  if(idx.length>3){for(let k=1;k+1<idx.length;k++)out.push(idx[0],idx[k],idx[k+1]);}
  return out;
}
function cleanRing(r){                                 // drop dupes + near-collinear verts
  let c=[];
  for(let i=0;i<r.length;i+=2){const x=r[i],z=r[i+1];
    if(c.length){const dx=x-c[c.length-2],dz=z-c[c.length-1];
      if(dx*dx+dz*dz<0.12)continue;                    // duplicate vertex
      if(c.length>=2){const ax=c[c.length-4],az=c[c.length-3],bx=c[c.length-2],bz=c[c.length-1];
        const abx=bx-ax,abz=bz-az,ab2=abx*abx+abz*abz;
        if(ab2>0.25&&Math.abs(abx*(z-bz)-abz*(x-bx))<0.06*Math.sqrt(ab2)&&abx*dx+abz*dz>0)
          {c[c.length-2]=x;c[c.length-1]=z;continue;}  // collinear: extend edge
      }}
    c.push(x,z);}
  let ch=true;
  while(ch&&c.length>4){ch=false;
    for(let k=0;k+3<c.length;k+=2){const ax=c[k],az=c[k+1],bx=c[k+2],bz=c[k+3],cx=c[k+4],cz=c[k+5];
      const abx=bx-ax,abz=bz-az,ab2=abx*abx+abz*abz;
      if(ab2>0.25&&Math.abs(abx*(cz-bz)-abz*(cx-bx))<0.06*Math.sqrt(ab2)){c.splice(k+2,2);ch=true;break;}}}
  return c;
}

// ---------- building extrusion ----------
const pos=[],nor=[],aid=[],seed=[],top=[],vvar=[],lvA=[],catA=[];
let BID=0;
const binfo=[];                                        // per building id -> meta
function addBuilding(ring,meta,sh,ht){                 // ring: world [x,z,...]
  let n=ring.length/2; if(n<3)return;
  if(ringArea(ring,n)<0){const t=ring.slice();for(let k=0;k<n;k++){ring[k*2]=t[(n-1-k)*2];ring[k*2+1]=t[(n-1-k)*2+1];}}
  const cr=cleanRing(ring);
  if(cr.length>=6){ring=cr;n=cr.length/2;}else return;
  const id=++BID, s=Math.random();
  for(let i=0;i<n;i++){                                // walls: 2 tris / segment
    const x0=ring[i*2],z0=ring[i*2+1],x1=ring[((i+1)%n)*2],z1=ring[((i+1)%n)*2+1];
    const dx=x1-x0,dz=z1-z0,L=Math.hypot(dx,dz); if(L<0.4)continue;
    const nx=dz/L,nz=-dx/L;                            // outward for CCW ring
    const put=(px,pz)=>{pos.push(px,0,pz);nor.push(nx,0,nz);aid.push(id);seed.push(s);top.push(0);
      vvar.push(sh);lvA.push(meta.lv);catA.push(meta.c);};
    const putT=(px,pz)=>{pos.push(px,ht,pz);nor.push(nx,0,nz);aid.push(id);seed.push(s);top.push(0);
      vvar.push(sh);lvA.push(meta.lv);catA.push(meta.c);};
    put(x0,z0);put(x1,z1);putT(x1,z1);                 // tri 1
    put(x0,z0);putT(x1,z1);putT(x0,z0);                // tri 2
  }
  const tris=tri(ring,n);
  for(let k=0;k<tris.length;k+=3){                     // roof, normal +y
    for(const t of [tris[k+2],tris[k+1],tris[k]]){
      pos.push(ring[t*2],ht,ring[t*2+1]);nor.push(0,1,0);aid.push(id);seed.push(s);top.push(1);
      vvar.push(sh);lvA.push(meta.lv);catA.push(meta.c);
    }
  }
  binfo.push({id,name:meta.n,cat:meta.c,lv:meta.lv,ht,area:Math.abs(ringArea(ring,n)),
    cx:ring.reduce((a,v,i)=>i%2?a:a+v,0)/n,cz:ring.reduce((a,v,i)=>i%2?a+v:a,0)/n});
}
// ---------- buildings ----------
const CATN=['office','residential','retail','service','civic','unclassified'];
const B=D.B,BX=D.BX,BY=D.BY;
let maxH=0,maxId=0,sumH=0;
for(let i=0;i<B.length;i+=6){
  const ni=B[i],c=B[i+1],lv=B[i+2],hcm=B[i+3],st=B[i+4],ln=B[i+5];
  const ring=new Array(ln*2);
  for(let k=0;k<ln;k++){ring[k*2]=xOf(BX[st+k]);ring[k*2+1]=zOf(BY[st+k]);}
  const h=hcm/10, sh=((ni+1)*2654435761>>>16)%97/97;
  addBuilding(ring,{n:ni,c,lv},sh,h);
  if(h>maxH){maxH=h;maxId=binfo.length-1;} sumH+=h;
}

// ---------- roads ----------
const R=D.R,RX=D.RX,RY=D.RY;
const rp=[],rn=[],rl=[],rz2=[],rw=[],rbr=[];
const paths=[];                                        // arterials for traffic
function addRoad(pts,w,br){
  const y=br?(w>=15?13:8):0.02;
  let acc=0;
  for(let i=0;i+1<pts.length/2;i++){
    const x0=pts[i*2],z0=pts[i*2+1],x1=pts[i*2+2],z1=pts[i*2+3];
    const dx=x1-x0,dz=z1-z0,L=Math.hypot(dx,dz); if(L<0.5)continue;
    const nx=-dz/L,nz=dx/L,hw=w/2;
    const v=(px,pz,s,l)=>{rp.push(px,y,pz);rn.push(0,1,0);rl.push(s);rz2.push(l);rw.push(w);rbr.push(br);};
    v(x0-nx*hw,z0-nz*hw,-1,acc); v(x1+nx*hw,z1+nz*hw,1,acc+L); v(x1-nx*hw,z1-nz*hw,-1,acc+L);
    v(x0-nx*hw,z0-nz*hw,-1,acc); v(x0+nx*hw,z0+nz*hw,1,acc);   v(x1+nx*hw,z1+nz*hw,1,acc+L);
    acc+=L;
  }
  if(acc>60)paths.push({pts,w,br,len:acc});
}
const pil=[];                                          // elevated pillars [x,z,h]
for(let i=0;i<R.length;i+=5){
  const ni=R[i],w=R[i+1],br=R[i+2],st=R[i+3],ln=R[i+4];
  const pts=new Array(ln*2);
  for(let k=0;k<ln;k++){pts[k*2]=xOf(RX[st+k]);pts[k*2+1]=zOf(RY[st+k]);}
  addRoad(pts,w,br);
  if(br&&w>=15){                                        // expressway pillars
    const y=13;
    for(let k=0;k+1<ln;k++){
      const x0=pts[k*2],z0=pts[k*2+1],x1=pts[k*2+2],z1=pts[k*2+3];
      const L=Math.hypot(x1-x0,z1-z0);
      for(let d=15;d<L;d+=32){const t=d/L,x=x0+(x1-x0)*t,z=z0+(z1-z0)*t;
        pil.push(x,z,y);}
    }
  }
}

// ---------- parks ----------
const P=D.P,PX=D.PX,PY=D.PY;
const pp=[],pn=[];
const parkRings=[];
for(let i=0;i<P.length;i+=2){
  const st=P[i],ln=P[i+1]; if(ln<4)continue;
  const ring=new Array(ln*2);
  for(let k=0;k<ln;k++){ring[k*2]=xOf(PX[st+k]);ring[k*2+1]=zOf(PY[st+k]);}
  const tris=tri(ring,ln);
  for(let k=0;k<tris.length;k+=3)
    for(const t of [tris[k+2],tris[k+1],tris[k]]){pp.push(ring[t*2],0.06,ring[t*2+1]);pn.push(0,1,0);}
  parkRings.push(ring);
}

// ---------- props: trees, lamps, cars ----------
let rnd=12345;const rr=()=>{rnd=(rnd*1103515245+12345)&0x7fffffff;return rnd/0x7fffffff;};
const trees=[],lamps=[];
for(let i=0;i<D.T.length;i+=2)trees.push([xOf(D.T[i]),zOf(D.T[i]),3+rr()*3]);
for(const ring of parkRings){                            // scatter inside parks
  let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
  for(let k=0;k<ring.length;k+=2){x0=Math.min(x0,ring[k]);x1=Math.max(x1,ring[k]);z0=Math.min(z0,ring[k+1]);z1=Math.max(z1,ring[k+1]);}
  const n=Math.min(60,Math.max(4,((x1-x0)*(z1-z0))/900|0));
  for(let k=0;k<n;k++){const x=x0+rr()*(x1-x0),z=z0+rr()*(z1-z0);
    if(inPoly(ring,x,z))trees.push([x,z,3+rr()*3.5]);}
}
for(const p of paths){                                   // street trees + lamps
  if(p.br)continue;
  for(let d=22;d<p.len;d+=44){const q=atLen(p.pts,d);
    lamps.push([q[0]+q[2]*p.w*0.62,q[1]+q[3]*p.w*0.62]);
    if(rr()<0.55)trees.push([q[0]-q[2]*p.w*0.75,q[1]-q[3]*p.w*0.75,3.4+rr()*2.2]);}
}
function inPoly(ring,x,z){let c=false;for(let i=0,j=ring.length/2-1;i<ring.length/2;j=i++)
  {const xi=ring[i*2],zi=ring[i*2+1],xj=ring[j*2],zj=ring[j*2+1];
   if((zi>z)!==(zj>z)&&x<(xj-xi)*(z-zi)/(zj-zi)+xi)c=!c;}return c;}
function atLen(pts,d){let acc=0;for(let i=0;i+1<pts.length/2;i++){const x0=pts[i*2],z0=pts[i*2+1],x1=pts[i*2+2],z1=pts[i*2+3];
  const L=Math.hypot(x1-x0,z1-z0);if(L<1e-6)continue;
  if(acc+L>=d){const t=(d-acc)/L;return[x0+(x1-x0)*t,z0+(z1-z0)*t,(x1-x0)/L,(z1-z0)/L];}acc+=L;}
  const n=pts.length/2;return[pts[(n-1)*2],pts[(n-1)*2+1],0,1];}
// ---------- shaders ----------
const U={uCam:{value:new THREE.Vector3()},uFogCol:{value:new THREE.Color()},uFogDen:{value:0.00035},
  uSun:{value:new THREE.Vector3(0,1,0)},uSunCol:{value:new THREE.Color()},uAmb:{value:new THREE.Color()},
  uNight:{value:0},uTime:{value:0},uSel:{value:0},uMinLv:{value:0},uCatMask:{value:63}};
const FOG=`vec3 fogm(vec3 c,vec3 p){float d=length(p-uCam);return mix(c,uFogCol,1.0-exp(-d*uFogDen));}
 vec3 srgb(vec3 c){return pow(clamp(c,0.0,1.0),vec3(0.4545));}`;
const HSH=`float h11(float x){return fract(sin(x*127.1)*4375.85453);}
 float h22(vec2 p){p=fract(p*vec2(123.4,456.7));p+=dot(p,p+34.5);return fract(p.x*p.y*78.9);}`;
const bmat=new THREE.ShaderMaterial({uniforms:U,
 vertexShader:`attribute float aId;attribute float aSeed;attribute float aTop;attribute float aVar;attribute float aLv;attribute float aCat;
  varying vec3 vP,vN;varying float vId,vSeed,vTop,vVar,vLv,vCat;
  void main(){vP=position;vN=normal;vId=aId;vSeed=aSeed;vTop=aTop;vVar=aVar;vLv=aLv;vCat=aCat;
  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
 fragmentShader:`precision highp float;uniform vec3 uCam,uFogCol,uSun,uSunCol,uAmb;uniform float uFogDen,uNight,uTime,uSel,uMinLv,uCatMask;
  varying vec3 vP,vN;varying float vId,vSeed,vTop,vVar,vLv,vCat;${HSH}${FOG}
  void main(){
    if(vLv<uMinLv||mod(floor(uCatMask/exp2(vCat)),2.0)<0.5)discard;
    vec3 col;float emis=0.0;
    if(vTop>0.5){
      float g=h22(floor(vP.xz*1.7)+vSeed*9.0);
      col=mix(vec3(0.26,0.27,0.29),vec3(0.46,0.47,0.50),g*0.6+0.2);
      float ac=step(0.86,h22(floor(vP.xz*0.35)+vSeed*3.0));
      col=mix(col,vec3(0.55,0.57,0.60),ac*0.8);
    }else{
      float ax=abs(vN.x)>0.5?vP.z:vP.x;
      float cu=floor(ax/3.0),cv=floor(vP.y/3.4);
      vec2 f=vec2(fract(ax/3.0),fract(vP.y/3.4));

    const b=binfo[id-1];
    tip.textContent=nmOf(b)||('building #'+b.id);
    tip.style.opacity=1;
    const p=new THREE.Vector3(b.cx,b.ht*0.9,b.cz);p.project(cam);
    tip.style.left=Math.round((p.x*0.5+0.5)*innerWidth)+'px';
    tip.style.top=Math.round((-p.y*0.5+0.5)*innerHeight)+'px';
  }else tip.style.opacity=0;
}

// ---------- selection card ----------
const card=document.createElement('div');card.className='card';card.style.opacity=0;document.body.appendChild(card);
function showCard(id){
  if(id<=0){card.style.opacity=0;return;}
  const b=binfo[id-1];
  const nm=nmOf(b)||('building #'+b.id);
  card.innerHTML=`<div class="nm">${nm}${EN[nm]?` · ${EN[nm]}`:''}</div>
    <div class="kv">height <span class="hi">${b.ht.toFixed(0)} m</span> · ${b.lv||'?'} levels · ${b.area.toFixed(0)} m² footprint</div>
    <div class="kv">${CATN[b.cat]} · id ${b.id}</div>`;
  const p=new THREE.Vector3(b.cx,b.ht,b.cz);p.project(cam);
  card.style.left=Math.max(8,Math.min(innerWidth-340,(p.x*0.5+0.5)*innerWidth+14))+'px';
  card.style.top=Math.max(8,Math.min(innerHeight-120,(-p.y*0.5+0.5)*innerHeight-14))+'px';
  card.style.opacity=1;
}
// ---------- landmarks ----------
const LM=binfo.filter(b=>b.name>=0&&b.ht>=60).sort((a,b)=>b.ht-a.ht).slice(0,14);
const EN={'パークコート千代田富士見ザ タワー':'Park Court Chiyoda Fujii Tower','プラウドタワー千代田富士見':'Proud Tower Chiyoda Fujii','飯田橋グラン・ブルーム':'Iidabashi Grand Bloom','ボアソナード・タワー':'Boulevard Tower','アルビオ・ザ・タワー千代田飯田橋':'Albio The Tower Chiyoda Iidabashi','SME六番町ビル':'SME Ryocho Building','診療棟':'Medical Clinic Building','シティタワー・ルフォン九段の杜':'City Tower Kuanjiro','ブリリア一番町':'Brillia Ichi-cho','パークコート三番町ヒルトップレジデンス':'Park Court Sanban-cho Hilltop Residences'};
// ---------- UI ----------
const panel=document.createElement('div');panel.className='panel';
panel.innerHTML=`<h1>Tokyo CBD · 1.00 sq mi</h1>
<div class="grp"><div class="lbl">Time of day</div>
<div class="row"><input type="range" id="tod" min="0" max="24" step="0.05" value="15.4"><span id="todv">15:24</span></div>
<div class="row"><input type="checkbox" id="cyc"><span>auto cycle</span></div></div>
<div class="grp"><div class="lbl">Building filters</div>
<div class="row"><input type="range" id="mlv" min="0" max="60" step="1" value="0"><span>min levels</span></div>
<div class="row"><input type="checkbox" id="c0" checked><span>office</span></div>
<div class="row"><input type="checkbox" id="c1" checked><span>residential</span></div>
<div class="row"><input type="checkbox" id="c2" checked><span>retail</span></div>
<div class="row"><input type="checkbox" id="c3" checked><span>service</span></div>
<div class="row"><input type="checkbox" id="c4" checked><span>civic</span></div>
<div class="row"><input type="checkbox" id="c5" checked><span>unclassified</span></div></div>
<div class="grp"><div class="lbl">Scene layers</div>
<div class="row"><input type="checkbox" id="lR" checked><span>roads</span></div>
<div class="row"><input type="checkbox" id="lT" checked><span>trees</span></div>
<div class="row"><input type="checkbox" id="lL" checked><span>street lights</span></div>
<div class="row"><input type="checkbox" id="lC" checked><span>traffic</span></div>
<div class="row"><input type="checkbox" id="lE" checked><span>expressway</span></div>
<div class="row"><input type="checkbox" id="lB" checked><span>1-mi boundary</span></div></div>
<div class="grp"><div class="lbl">Camera</div>
<select id="camsel"><option value="fly">free-fly</option><option value="street">street level</option><option value="map">top-down map</option></select>
<div class="row"><button id="rst">reset view</button><button id="shot">screenshot</button></div></div>
<div class="grp"><div class="lbl">Landmark</div>
<select id="lmsel">${LM.map((b,i)=>`<option value="${i}">${NAMES[b.name]} (${EN[NAMES[b.name]]}) · ${b.ht|0} m</option>`).join('')}</select>
<div class="row"><button id="go">go to landmark</button><button id="focus">focus selected</button></div></div>`;
document.body.appendChild(panel);
const $=id=>document.getElementById(id);
const tod=$('tod'),cyc=$('cyc'),mlv=$('mlv'),cc=[0,1,2,3,4,5].map(i=>$('c'+i));
const lR=$('lR'),lT=$('lT'),lL=$('lL'),lC=$('lC'),lE=$('lE'),lB=$('lB');
const camSel=$('camsel'),lmSel=$('lmsel');
function syncUI(){
  hour=+tod.value;
  U.uMinLv.value=+mlv.value;
  let m=0;cc.forEach((c,i)=>{if(c.checked)m|=1<<i;});U.uCatMask.value=m;
  rmesh.visible=lR.checked;treeMesh.visible=lT.checked;lampMesh.visible=lL.checked;
  glowMesh.visible=lL.checked;carMesh.visible=lC.checked;pilMesh.visible=lE.checked;bline.visible=lB.checked;
  mode=camSel.value;
  if(mode!==lastMode){if(mode==='street')pitch=0;lastMode=mode;}
  $('todv').textContent=String(Math.floor(hour)).padStart(2,'0')+':'+String(Math.floor((hour%1)*60)).padStart(2,'0');
}
$('go').onclick=()=>{if(!LM.length)return;const b=LM[+lmSel.value||0];tgt.set(b.cx,0,b.cz);
  dist=Math.max(140,b.ht*3.2);pitch=0.5;camSel.value='fly';};
$('focus').onclick=()=>{if(selId<=0)return;const b=binfo[selId-1];tgt.set(b.cx,0,b.cz);
  dist=Math.max(70,b.ht*3);pitch=0.45;};
$('rst').onclick=()=>{tgt.set(0,0,0);yaw=0.35;pitch=0.62;dist=1250;camSel.value='fly';};
$('shot').onclick=()=>{const a=document.createElement('a');a.download='tokyo-1sqmi.png';
  a.href=rend.domElement.toDataURL('image/png');a.click();};

const hud=document.createElement('div');hud.className='stat';document.body.appendChild(hud);
const modeEl=document.createElement('div');modeEl.className='mode';document.body.appendChild(modeEl);
const helpEl=document.createElement('div');helpEl.className='help';
helpEl.innerHTML=matchMedia('(pointer:coarse)').matches?`<b>1 finger</b> look · <b>pinch</b> zoom
<b>tap</b> select building · <b>panel</b> controls`:`<b>drag</b> look · <b>wheel</b> zoom · <b>WASD</b> move
<b>space/v</b> up/down · <b>shift</b> fast
<b>T</b> auto time · <b>F</b> fly · <b>G</b> street · <b>M</b> map
<b>click</b> select building · <b>hover</b> name`;
document.body.appendChild(helpEl);

// ---------- events ----------
const cv=rend.domElement;
let drag=null;const tpts=new Map();
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse'){tpts.set(e.pointerId,[e.offsetX,e.offsetY]);drag=tpts.size===1?[e.offsetX,e.offsetY]:null;return;}
  if(e.button===0)drag=[e.offsetX,e.offsetY];});
cv.addEventListener('pointerup',e=>{if(e.button>0)return;drag=null;tpts.delete(e.pointerId);
  const id=pickAt(e.offsetX/innerWidth,e.offsetY/innerHeight);
  if(id>0){selId=id;U.uSel.value=id;showCard(id);}else{selId=0;U.uSel.value=0;card.style.opacity=0;}});
cv.addEventListener('pointercancel',e=>{drag=null;tpts.delete(e.pointerId);});
cv.addEventListener('pointermove',e=>{
  if(tpts.has(e.pointerId)){
    if(tpts.size===2){
      const o=[...tpts.keys()].filter(k=>k!==e.pointerId).map(k=>tpts.get(k))[0];
      const p=tpts.get(e.pointerId);
      const d0=Math.hypot(p[0]-o[0],p[1]-o[1]),d1=Math.hypot(e.offsetX-o[0],e.offsetY-o[1]);
      if(d0>20&&d1>20)dist=Math.max(14,Math.min(4200,dist*d1/d0));
      tpts.set(e.pointerId,[e.offsetX,e.offsetY]);return;}
    tpts.set(e.pointerId,[e.offsetX,e.offsetY]);}
  if(drag){yaw+=(e.offsetX-drag[0])*0.0055;pitch+=(e.offsetY-drag[1])*0.0055;
    pitch=Math.max(-1.1,Math.min(1.5,pitch));drag=[e.offsetX,e.offsetY];}
  if(performance.now()-lastPick>45&&Math.abs(e.offsetX-lastPX)+Math.abs(e.offsetY-lastPY)>3){
    lastPick=performance.now();lastPX=e.offsetX;lastPY=e.offsetY;pickNow(e);}});
cv.addEventListener('wheel',e=>{dist*=e.deltaY>0?1.1:0.9;dist=Math.max(14,Math.min(4200,dist));});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys.add(k);
  if(k==='t'){auto=!auto;}if(k==='f')camSel.value='fly';if(k==='g')camSel.value='street';if(k==='m')camSel.value='map';});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('resize',()=>{rend.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix();idRT.setSize(Math.ceil(innerWidth/2),Math.ceil(innerHeight/2));});

// ---------- loop ----------
let auto=false,prev=performance.now(),frames=0,facc=0,fps=0;
const M4=new THREE.Matrix4();
function tick(){
  const now=performance.now(),dt=Math.min(0.05,(now-prev)/1000);prev=now;
  if(auto)hour=(hour+dt*0.55)%24;
  syncUI();setTime();camMove(dt);camApply();
  for(let i=0;i<cars.length;i++){const c=cars[i];
    c.d+=c.sp*dt*c.dir;if(c.d<0)c.d+=c.p.len;if(c.d>c.p.len)c.d-=c.p.len;
    const q=atLen(c.p.pts,c.d);
    M4.makeRotationY(Math.atan2(q[2]*c.dir,q[3]*c.dir));M4.setPosition(q[0],1.0,q[1]);
    carMesh.setMatrixAt(i,M4);}
  carMesh.instanceMatrix.needsUpdate=true;
  U.uCam.value.copy(cam.position);U.uTime.value=now/1000;
  rend.render(scene,cam);
  mmBlip(tgt.x,tgt.z,yaw);
  frames++;facc+=dt;
  if(facc>0.5){fps=frames/facc;frames=0;facc=0;
    hud.innerHTML=`<b>${binfo.length}</b> buildings · <b>${(W/1000).toFixed(2)}×${(H/1000).toFixed(2)} km</b> = 1.00 sq mi
      <div>tallest <b>${maxH.toFixed(0)} m</b> · avg ${(sumH/binfo.length).toFixed(1)} m · ${paths.length} roads</div>
      <div>alt <b>${(mode==='street'?1.7:dist).toFixed(0)} m</b> · ${fps.toFixed(0)} fps</div>
      <div>${(LAT0+(tgt.z+H/2)/M_LAT).toFixed(5)}, ${(LON0+(tgt.x+W/2)/M_LON).toFixed(5)}</div>`;}
  modeEl.textContent=mode+(selId>0?' · '+(nmOf(binfo[selId-1])||'unnamed'):'');
  requestAnimationFrame(tick);
}
tick();
</script>
</html>
